name: Build App

on:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-13
            name: mac-intel
          - os: macos-14
            name: mac-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller NeoDBS.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoDBS-${{ matrix.name }}
          path: dist/