name: Build App

on:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows

          - os: ubuntu-latest
            name: linux

          - os: macos-latest
            name: mac-arm
            arch: arm64

          - os: macos-latest
            name: mac-intel
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch || 'x64' }}

      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller NeoDBS.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoDBS-${{ matrix.name }}
          path: dist/